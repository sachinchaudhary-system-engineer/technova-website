
services:
  frontend:
    build: .
    image: technova-website:v3.0
    ports:
      - "8081:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    image: technova-api:v3.0
    expose:
      - "5000"
    environment:
      PORT: "5000"
      DATA_DIR: /data
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      CACHE_TTL: "60"
    volumes:
      - backend-data:/data
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  backend-data:
  redis-data:

networks:
  app-network:
    driver: bridge
