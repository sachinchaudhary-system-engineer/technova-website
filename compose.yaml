
services:
  frontend:
    build: .
    image: technova-website:v2.0
    ports:
      - "8081:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    image: technova-api:v2.0
    expose:
      - "5000"
    environment:
      PORT: "5000"
      DATA_DIR: /data
    volumes:
      - backend-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  backend-data:

networks:
  app-network:
    driver: bridge
